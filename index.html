<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeatherNow · City Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dashboard-container">
    <!-- Header & Search Bar -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🌤️</span>
        <h1>WeatherNow</h1>
      </div>

      <form class="search-form" id="search-form">
        <label for="city-input" class="sr-only">Search for a city</label>
        <input
          type="text"
          id="city-input"
          class="search-input"
          placeholder="Enter city name (e.g., Bengaluru, London)..."
          autocomplete="off"
        />
        <button type="submit" id="search-btn" class="search-btn">Search</button>
        <button
          type="button"
          id="location-btn"
          class="location-btn"
          title="Use my current location"
          aria-label="Use my current location"
        >
          📍
        </button>
      </form>
    </header>

    <!-- Loading, Error & Validation Banner -->
    <p id="status-message" class="status-message" role="alert" aria-live="polite"></p>

    <main>
      <!-- Large Current Weather Card (Populated by Live API) -->
      <section class="current-weather-card" aria-label="Current Weather">
        <div class="current-main">
          <div class="city-info">
            <h2 class="current-city" id="current-city">Loading...</h2>
            <p class="current-condition" id="current-condition">--</p>
          </div>
          <div class="temp-display">
            <span class="current-emoji" id="current-emoji" aria-hidden="true">⛅</span>
            <span class="current-temp" id="current-temp">--°C</span>
            <button
              type="button"
              id="unit-toggle"
              class="unit-toggle-btn"
              aria-label="Toggle between Celsius and Fahrenheit"
            >
              Switch to °F
            </button>
          </div>
        </div>

        <div class="current-details">
          <div class="detail-item">
            <span class="detail-label">Wind Speed</span>
            <span class="detail-value current-wind" id="current-wind">-- km/h</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Humidity</span>
            <span class="detail-value current-humidity" id="current-humidity">--%</span>
          </div>
        </div>
      </section>

      <!-- 7-Day Forecast Section (Cards Created by JS) -->
      <section class="forecast-section" aria-label="7-Day Forecast">
        <h3 class="section-title">7-Day Forecast</h3>
        <div class="forecast-row" id="forecast-row"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
