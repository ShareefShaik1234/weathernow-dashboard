<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeatherNow · City Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dashboard-container">
    <!-- Header & Search Bar -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🌤️</span>
        <h1>WeatherNow</h1>
      </div>

      <form class="search-form" id="search-form">
        <label for="city-input" class="sr-only">Search for a city</label>
        <input
          type="text"
          id="city-input"
          class="search-input"
          placeholder="Enter city name (e.g., Bengaluru, London)..."
          autocomplete="off"
        />
        <button type="submit" class="search-btn">Search</button>
      </form>
    </header>

    <main>
      <!-- Large Current Weather Card -->
      <section class="current-weather-card" aria-label="Current Weather">
        <div class="current-main">
          <div class="city-info">
            <h2 class="current-city">Madanapalle, IN</h2>
            <p class="current-condition">Partly Cloudy</p>
          </div>
          <div class="temp-display">
            <span class="current-emoji" aria-hidden="true">⛅</span>
            <span class="current-temp">26°C</span>
          </div>
        </div>

        <div class="current-details">
          <div class="detail-item">
            <span class="detail-label">Wind Speed</span>
            <span class="detail-value current-wind">14 km/h</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Humidity</span>
            <span class="detail-value current-humidity">62%</span>
          </div>
        </div>
      </section>

      <!-- 7-Day Forecast Section -->
      <section class="forecast-section" aria-label="7-Day Forecast">
        <h3 class="section-title">7-Day Forecast</h3>
        <div class="forecast-row" id="forecast-row">
          <article class="forecast-card">
            <span class="forecast-day">Thu</span>
            <span class="forecast-icon" aria-hidden="true">☀️</span>
            <div class="forecast-temps">
              <span class="temp-max">28°</span>
              <span class="temp-min">18°</span>
            </div>
          </article>

          <article class="forecast-card">
            <span class="forecast-day">Fri</span>
            <span class="forecast-icon" aria-hidden="true">⛅</span>
            <div class="forecast-temps">
              <span class="temp-max">27°</span>
              <span class="temp-min">17°</span>
            </div>
          </article>

          <article class="forecast-card">
            <span class="forecast-day">Sat</span>
            <span class="forecast-icon" aria-hidden="true">🌧️</span>
            <div class="forecast-temps">
              <span class="temp-max">24°</span>
              <span class="temp-min">16°</span>
            </div>
          </article>

          <article class="forecast-card">
            <span class="forecast-day">Sun</span>
            <span class="forecast-icon" aria-hidden="true">🌦️</span>
            <div class="forecast-temps">
              <span class="temp-max">25°</span>
              <span class="temp-min">16°</span>
            </div>
          </article>

          <article class="forecast-card">
            <span class="forecast-day">Mon</span>
            <span class="forecast-icon" aria-hidden="true">☀️</span>
            <div class="forecast-temps">
              <span class="temp-max">29°</span>
              <span class="temp-min">18°</span>
            </div>
          </article>

          <article class="forecast-card">
            <span class="forecast-day">Tue</span>
            <span class="forecast-icon" aria-hidden="true">☀️</span>
            <div class="forecast-temps">
              <span class="temp-max">30°</span>
              <span class="temp-min">19°</span>
            </div>
          </article>

          <article class="forecast-card">
            <span class="forecast-day">Wed</span>
            <span class="forecast-icon" aria-hidden="true">☁️</span>
            <div class="forecast-temps">
              <span class="temp-max">26°</span>
              <span class="temp-min">17°</span>
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
